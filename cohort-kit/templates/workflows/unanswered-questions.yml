# The doubt mechanism's alert half.
#
# A question in Q&A with no answer marked and no instructor comment for a day is a question
# the cohort has already stopped waiting on. This finds those, and keeps ONE tracking issue
# up to date, assigned to the instructors. GitHub's own notifications do the alerting: an
# assignment notifies, an edit to an issue you are assigned to notifies. No webhook, no
# third-party service, nothing to configure beyond the instructor handles in cohort.yaml.
#
# Why an issue and not a comment on each thread: a bot comment on a learner's question reads
# as "nobody has answered you", which is true and unkind. The issue is instructor-facing.
#
# Runs on the built-in token. Needs discussions: read and issues: write, nothing else.
name: Unanswered questions

on:
  schedule:
    - cron: "23 4 * * *"          # daily, off the hour
  workflow_dispatch:
    inputs:
      hours:
        description: "How long a question may wait before it is listed"
        required: false
        default: "24"
      dry_run:
        description: "Print the list without touching the issue"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  discussions: read
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml

      - name: Find them and update the tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.hours || '24' }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          args=(--owner "${GITHUB_REPOSITORY%%/*}" --repo "${GITHUB_REPOSITORY##*/}"
                --hours "$HOURS" --config cohort.yaml)
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          python cohort-kit/scripts/unanswered_questions.py "${args[@]}" | tee unanswered.md
          { echo "### Unanswered questions"; echo; cat unanswered.md; } >> "$GITHUB_STEP_SUMMARY"
