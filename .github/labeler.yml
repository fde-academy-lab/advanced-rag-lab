# Auto-label PRs by what they touch, so the board and the reviewers route themselves.
"area: notebooks":
  - changed-files: [{ any-glob-to-any-file: "notebooks/**" }]
"area: toolkit":
  - changed-files: [{ any-glob-to-any-file: "raglab/**" }]
"area: retrieval":
  - changed-files: [{ any-glob-to-any-file: ["raglab/retrieve.py", "raglab/store.py", "raglab/embed.py", "raglab/chunking.py"] }]
"area: evaluation":
  - changed-files: [{ any-glob-to-any-file: ["raglab/metrics.py", "raglab/judge.py", "raglab/pipeline.py", ".github/eval-baseline.json"] }]
"area: agent":
  - changed-files: [{ any-glob-to-any-file: "raglab/agent.py" }]
"area: cost":
  - changed-files: [{ any-glob-to-any-file: "raglab/costs.py" }]
"area: docs":
  - changed-files: [{ any-glob-to-any-file: ["docs/**", "*.md"] }]
"area: ci":
  - changed-files: [{ any-glob-to-any-file: [".github/**", "Makefile", "pyproject.toml"] }]
"area: bedrock":
  - changed-files: [{ any-glob-to-any-file: "raglab/bedrock.py" }]
"needs: eval-numbers":
  - changed-files: [{ any-glob-to-any-file: ["raglab/retrieve.py", "raglab/metrics.py", "raglab/corpus.py", "raglab/chunking.py", "raglab/embed.py"] }]
