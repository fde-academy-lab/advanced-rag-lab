# The L.A.B. Simulator's grader, running on a machine that is not yours.
#
# Two jobs, and they answer two different questions.
#
#   integrity  — do the units still do what they claim? Every unit ships a worked answer the
#                grader must accept and decoys it must reject, and this job runs them. A check
#                that has never rejected anything is not evidence of anything, so a unit whose
#                decoys start passing fails the build even though nothing "broke".
#
#   grade      — did this learner's attempt clear? Same code path as `labsim check` locally,
#                so the comment on the pull request and the output in your terminal cannot
#                disagree. The result is posted as a comment rather than left in the log,
#                because the log is where people stop reading.
#
# Grading never blocks a merge. A red tick on somebody's first attempt at a hard unit is
# information, not a gate — see the `continue-on-error` on the grading step and the note in
# lab-simulator/README.md about why this repo does not fail a learner's pull request.
name: L.A.B. Simulator

on:
  push:
    branches: [main]
    paths:
      - "lab-simulator/**"
      - ".github/workflows/lab-simulator.yml"
  pull_request:
    paths:
      - "lab-simulator/**"
      - ".github/workflows/lab-simulator.yml"
  workflow_dispatch:
    inputs:
      units:
        description: "Space-separated unit ids to self-test, or blank for all"
        required: false
        default: ""

concurrency:
  group: labsim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integrity:
    name: Units still discriminate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"

      - name: Structure — ids, prerequisites, cycles, missing references
        working-directory: lab-simulator
        run: python -m labsim validate

      - name: Self-test — accept every worked answer, reject every decoy
        id: selftest
        working-directory: lab-simulator
        run: |
          set -o pipefail
          python -m labsim selftest ${{ inputs.units }} | tee selftest.txt

      - name: Summary
        if: always()
        working-directory: lab-simulator
        run: |
          {
            echo "## 🔬 Unit self-test"
            echo
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' selftest.txt 2>/dev/null || echo "did not run"
            echo '```'
            echo
            echo "> A decoy that gets accepted means the unit has stopped discriminating:"
            echo "> it still passes, but it no longer teaches the thing it is named after."
          } >> "$GITHUB_STEP_SUMMARY"

  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_lab_simulator.py -q
      - run: ruff check lab-simulator

  grade:
    name: Grade submitted attempts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"

      - name: What did this pull request touch
        id: diff
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          echo "attempts=$(grep -c '^lab-simulator/attempts/' changed.txt || true)" >> "$GITHUB_OUTPUT"
          cat changed.txt

      - name: Grade
        id: grade
        if: steps.diff.outputs.attempts != '0'
        continue-on-error: true            # a failed attempt is information, not a broken build
        working-directory: lab-simulator
        run: python -m labsim ci --paths ../changed.txt --out ../labsim-comment.md

      - name: Comment the result on the pull request
        if: steps.diff.outputs.attempts != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try { body = fs.readFileSync('labsim-comment.md', 'utf8'); } catch { return; }
            if (!body.trim()) return;
            body += "\n---\n<sub>Graded by `python -m labsim check` on a clean checkout — "
                  + "the same code path you ran locally. A red result does not block this "
                  + "pull request.</sub>\n";
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = comments.find(c => c.body.includes('<!-- labsim-report -->'));
            if (mine) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Record the outcome in the run summary
        if: always() && steps.diff.outputs.attempts != '0'
        run: |
          if [ -s labsim-comment.md ]; then cat labsim-comment.md >> "$GITHUB_STEP_SUMMARY"; fi
