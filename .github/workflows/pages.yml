# Publish the lab as a browsable site: a landing page that explains the Client Zero engagement,
# and the ten notebooks executed with their outputs.
#
# The landing page builds in seconds and does not depend on the notebooks. That split is
# deliberate — a notebook that fails to execute degrades one list entry to a GitHub link rather
# than taking the whole site down with it.
name: Pages
on:
  push:
    branches: [main]
    paths: ["notebooks/**", "raglab/**", "docs/**", "scripts/build_site.py",
            ".github/workflows/pages.yml", ".identity.json"]
  workflow_dispatch:
    inputs:
      notebooks:
        description: "Execute and export the notebooks (adds ~12 min)"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]" nbconvert

      - name: Build the site
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.notebooks }}" = "false" ]; then
            python scripts/build_site.py --out _site
          else
            python scripts/build_site.py --out _site --notebooks
          fi

      - name: Sanity-check the output
        run: |
          test -f _site/index.html || { echo "::error::no index.html produced"; exit 1; }
          test -f _site/.nojekyll || { echo "::error::missing .nojekyll"; exit 1; }
          echo "index.html $(wc -c < _site/index.html) bytes, \
          $(find _site -name '*.html' | wc -l) html files total"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
