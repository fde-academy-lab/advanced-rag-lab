# JIRA-like movement, without JIRA. Items land on the board automatically and move
# columns as their state changes, so the board is a reflection of reality rather
# than a thing somebody has to remember to update.
name: Project board
on:
  issues:
    types: [opened, reopened, closed, labeled, assigned]
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft]
permissions:
  contents: read
  repository-projects: write
  issues: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Add new items to the board
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/akash-coded/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Explain what the board expects
        if: github.event.action == 'opened' && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                "🗂 Added to the **Advanced RAG — Delivery Board**.",
                "",
                "It will move through `Backlog → Ready → In progress → In review → Done`",
                "as labels and state change. Two conventions worth knowing:",
                "",
                "- Move it to **Ready** only when the acceptance criteria are written down.",
                "  \"Improve retrieval\" is not acceptance criteria; \"full-chain recall on the",
                "  comparison slice rises ≥5 points at unchanged k, and holds on frozen\" is.",
                "- Anything touching `nanorag/` gets the `needs: eval-numbers` label",
                "  automatically. The eval gate will post a scorecard on the PR."
              ].join("\n")
            });
        continue-on-error: true
