name: Docs links
on:
  push: { paths: ["**/*.md", ".github/workflows/link-check.yml"] }
  pull_request: { paths: ["**/*.md"] }
  schedule: [{ cron: "30 5 * * 0" }]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links resolve
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(".")
          bad = []
          pat = re.compile(r"\[[^\]]*\]\(([^)#]+?)(?:#[^)]*)?\)")
          for md in root.rglob("*.md"):
              if ".git" in md.parts:
                  continue
              for link in pat.findall(md.read_text(encoding="utf-8", errors="ignore")):
                  if link.startswith(("http://", "https://", "mailto:", "<")):
                      continue
                  target = (md.parent / link).resolve()
                  if not target.exists():
                      bad.append(f"{md}: {link}")
          if bad:
              print("Broken relative links:", *bad, sep="\n  ")
              sys.exit(1)
          print("all relative links resolve")
          PY

  mermaid:
    name: Mermaid renders on GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      # Parses every diagram with htmlLabels:false — GitHub's setting, not mermaid's default.
      # Validating under the default is how eight broken diagrams shipped looking fine locally.
      - run: npm run check:mermaid
