name: Docs links
on:
  push: { paths: ["**/*.md", ".github/workflows/link-check.yml"] }
  # No `paths` filter on pull_request, deliberately. Both jobs here are required status checks
  # on `main`, and a required check that is path-filtered never reports on a pull request
  # outside those paths — GitHub leaves it "Expected" and the branch can never be merged except
  # by an administrator bypassing protection. Thirty seconds a pull request is the price of the
  # gate actually being a gate.
  pull_request:
  schedule: [{ cron: "30 5 * * 0" }]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs the same checker as `make lint`, rather than an inline copy of it. The inline
      # version drifted: it lacked the ../../discussions skip and could not see that an empty
      # directory is untracked, so it failed on links that were fine and passed on ones that
      # were not.
      - name: Check relative links resolve
        run: python scripts/lint/check_links.py .

  mermaid:
    name: Mermaid renders on GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      # Parses every diagram with htmlLabels:false — GitHub's setting, not mermaid's default.
      # Validating under the default is how eight broken diagrams shipped looking fine locally.
      - run: npm run check:mermaid
