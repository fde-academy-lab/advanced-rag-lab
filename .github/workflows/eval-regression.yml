# The evaluation harness as a release gate — the deck's section 6 HLD, running for real.
#
# Trigger: any change that could move a number. Hard-blocks on a metric regression
# beyond tolerance; posts the scorecard on the PR either way so the delta is visible
# to a reviewer without them running anything.
name: Eval gate

on:
  pull_request:
    paths:
      - "raglab/**"
      - ".github/eval-baseline.json"
      - ".github/workflows/eval-regression.yml"
  workflow_dispatch:
  schedule:
    - cron: "42 4 * * *"

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: Retrieval + answer suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"

      - name: Run the evaluation suite
        id: eval
        run: |
          set -o pipefail
          python scripts/run_eval.py | tee eval-output.txt
        continue-on-error: true

      - name: Frozen slice (reported, never tuned against)
        run: python scripts/run_eval.py --slice frozen --out frozen-report.json | tee -a eval-output.txt
        continue-on-error: true

      - name: Build the scorecard
        if: always()
        run: |
          {
            echo "## Eval gate"
            echo
            echo '```'
            cat eval-output.txt
            echo '```'
            echo
            echo "> A delta inside the noise band is not a result. If you are shipping a"
            echo "> deliberate change to a public number, re-baseline in this PR:"
            echo "> \`python scripts/run_eval.py --baseline\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Comment the scorecard on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = "## 📊 Eval gate\n\n```\n"
              + fs.readFileSync('eval-output.txt', 'utf8').slice(-5000)
              + "\n```\n\n<sub>A delta inside the noise band is not a result. "
              + "Re-baseline deliberate changes with `python scripts/run_eval.py --baseline`.</sub>";
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number });
            const mine = comments.find(c => c.body.startsWith('## 📊 Eval gate'));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Fail if a gated metric regressed
        if: steps.eval.outcome == 'failure'
        run: |
          echo "::error::A gated metric dropped beyond tolerance. See the scorecard above."
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: |
            eval-report.json
            frozen-report.json
