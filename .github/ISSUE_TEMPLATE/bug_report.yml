name: 🐛 Bug report
description: Something in the toolkit or a notebook behaves incorrectly
title: "[bug] "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: does it reproduce on a fresh kernel with **Run All**? A stale kernel
        holding an old `raglab` module is the single most common false alarm here.
  - type: input
    id: where
    attributes:
      label: Where
      description: Notebook and cell, or module and function
      placeholder: "04_retrieval_methods_and_reranking.ipynb, §4.6 — or raglab/store.py:ann_vector"
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the traceback or the wrong numbers. Numbers are evidence; "it looks off" is not.
      render: text
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The fewest lines that show it. Start from `raglab.quickstart()` if you can.
      render: python
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Blocks a cohort session"
        - "Wrong number reported (silent)"
        - "Crashes but obvious"
        - "Cosmetic"
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "python 3.11.9, macOS 14, JupyterLab 4.2, numpy 2.0.1"
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I restarted the kernel and ran all cells from the top
          required: true
        - label: I checked open issues and Discussions for the same symptom
          required: true
